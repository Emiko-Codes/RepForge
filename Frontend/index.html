<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout Logger</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="sidebar-layout">
      <aside class="sidebar">
        <nav class="icons" aria-label="Workout navigation">
          <button class="icon-button active" type="button" data-nav="top" aria-label="Go to top" title="Top">
            <i class="fa-solid fa-house"></i>
          </button>
          <button class="icon-button" type="button" data-nav="workout" aria-label="Go to exercises" title="Exercises">
            <i class="fa-solid fa-dumbbell"></i>
          </button>
          <button class="icon-button" type="button" data-nav="summary" aria-label="Go to summary" title="Summary">
            <i class="fa-solid fa-chart-simple"></i>
          </button>
          <button class="icon-button" type="button" data-nav="reset" aria-label="Reset workout" title="Reset workout">
            <i class="fa-solid fa-rotate-left"></i>
          </button>
        </nav>
      </aside>

      <main class="page" id="top">
        <div class="page-inner">
          <header class="header">
            <div class="header-left">
              <h2>Workout Logger</h2>
              <p id="currentDate"></p>
            </div>

            <div class="header-centre">
              <h1 id="workoutTitle"></h1>
              <p id="feedbackMessage" aria-live="polite"></p>
            </div>

            <div class="header-right">
              <p>Duration: <span id="workoutDuration"></span></p>
              <div class="header-buttons">
                <button id="addExerciseBtn" type="button">Add Exercise</button>
                <button id="saveWorkoutBtn" type="button">Save</button>
                <button id="finishButton" type="button">Finish</button>
              </div>
            </div>
          </header>

          <section id="exerciseList" aria-label="Exercises"></section>

          <section class="summary" id="summary">
            <h2>Workout Summary</h2>
            <div class="summary-stats">
              <p>Exercises: <span id="exerciseCount">0</span></p>
              <p>Sets: <span id="setCount">0</span></p>
              <p>Done: <span id="doneCount">0</span></p>
              <p>Notes: <span id="notesText">Feeling Strong</span></p>
            </div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
